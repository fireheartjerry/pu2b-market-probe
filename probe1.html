<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe1</title></head>
<body>
<pre id="out">RUNNING...</pre>
<script>
(async () => {
  const out = [];
  try {
    const r = await fetch('https://gamma-api.polymarket.com/markets?limit=1');
    const txt = await r.text();
    out.push('GAMMA_STATUS=' + r.status);
    out.push('GAMMA_BYTES=' + txt.length);
    out.push('GAMMA_HEAD=' + txt.slice(0, 120));
  } catch (e) { out.push('GAMMA_ERR=' + e.message); }
  try {
    const r2 = await fetch('https://api.elections.kalshi.com/trade-api/v2/markets?limit=1&status=open');
    const t2 = await r2.text();
    out.push('KALSHI_STATUS=' + r2.status);
    out.push('KALSHI_BYTES=' + t2.length);
  } catch (e) { out.push('KALSHI_ERR=' + e.message); }
  // blob download test
  try {
    const blob = new Blob([JSON.stringify({probe: 1, ts: Date.now()})], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pu2b_dltest.json';
    document.body.appendChild(a);
    a.click();
    out.push('DOWNLOAD_TRIGGERED=1');
  } catch (e) { out.push('DL_ERR=' + e.message); }
  document.getElementById('out').textContent = out.join('\n');
  document.title = 'PROBE_DONE';
})();
</script>
</body>
</html>
